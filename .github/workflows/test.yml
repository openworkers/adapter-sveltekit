name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd test/fixtures/kit3 --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Type check
        run: bun check

      - name: Run tests
        run: bun test
